<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the site · Van Sirisouk</title>
<meta name="description" content="A terminal for asking about Van Sirisouk's work, numbers, and roles. It reads this site only.">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('vs-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6f6f3'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' text-anchor='middle' fill='%232b3a8f'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/tui.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="top__in">
    <a class="top__name" href="index.html">Van Sirisouk</a>
    <nav class="top__nav" id="site-nav" aria-label="Site">
      <a href="work.html">Work</a>
      <a href="report.html">Report</a>
      <a href="about.html">About</a>
      <a class="top__cta" href="mailto:hello@vansirisouk.com">Contact</a>
    </nav>
    <div class="top__actions">
      <a class="ask" id="ask-back" href="index.html" data-on="true" aria-label="Ask the site: on. Activate to leave." title="Leave the site agent">
        <span class="ask__track" aria-hidden="true"><span class="ask__knob"></span></span>
        <span class="ask__label" aria-hidden="true">Ask</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      </button>
      <button class="top__menu" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </div>
</header>

<main class="agent" id="main">
  <h1 class="sr-only">Ask the site agent</h1>
  <div class="agent__in">
    <header class="agent__head">
      <p class="agent__title"><span class="agent__hash" aria-hidden="true">#</span> ask-van</p>
      <span class="agent__rule" aria-hidden="true"></span>
      <p class="agent__topic">reads this site only</p>
    </header>
    <div class="agent__log" id="tui-log" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="agent__composer">
      <form class="composer" id="tui-form">
        <label class="sr-only" for="tui-input">Ask a question</label>
        <input class="composer__input" id="tui-input" name="q" type="text" placeholder="ask a question..." autocomplete="off" spellcheck="false">
        <button class="composer__send" type="submit" aria-label="Send message"><span aria-hidden="true">→</span></button>
      </form>
      <p class="agent__hint">Enter to send · ↑↓ history · esc to leave</p>
    </div>
  </div>
</main>

<script src="assets/site.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/tui.js"></script>
</body>
</html>
