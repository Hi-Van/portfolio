name: check

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Lint the design spec
        run: npm run lint:design

      - name: Run the gate
        run: npm run check
